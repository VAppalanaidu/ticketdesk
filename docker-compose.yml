services:
  mysql-db:
    image: mysql:8.0
    container_name: ticketdesk-db
    restart: always
    environment:
      MYSQL_DATABASE: ticketdesk_db
      MYSQL_USER: ticketdesk_user
      MYSQL_PASSWORD: TicketDeskSecurePass2026!
      MYSQL_ROOT_PASSWORD: RootPassword2026!
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./ticketdesk-backend
      dockerfile: Dockerfile
    container_name: ticketdesk-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mysql-db
      DB_NAME: ticketdesk_db
      DB_USERNAME: ticketdesk_user
      DB_PASSWORD: TicketDeskSecurePass2026!
      JWT_SECRET: 8Zz5tw0Ionm3HGZZZqLp9X1vA0bK2nC3dE4fG5hI6jK7lM8nO9pQ0rS1tU2vW3xY4z
    depends_on:
      mysql-db:
        condition: service_healthy

  frontend:
    build:
      context: ./ticketdesk-frontend
      dockerfile: Dockerfile
    container_name: ticketdesk-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data:
