<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="td-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="td-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Base Rounded Card -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#td-grad)" filter="url(#td-shadow)" />

  <!-- Inner Support Ticket & Headset Motif -->
  <g fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Ticket / Card Outline -->
    <path d="M18 20 C18 17.8 19.8 16 22 16 L42 16 C44.2 16 46 17.8 46 20 L46 44 C46 46.2 44.2 48 42 48 L22 48 C19.8 48 18 46.2 18 44 Z" opacity="0.25" fill="#ffffff"/>
    
    <!-- Support Headset Arc -->
    <path d="M20 30 C20 22.3 25.4 17 32 17 C38.6 17 44 22.3 44 30" />
    
    <!-- Ear Pads -->
    <rect x="17" y="29" width="6" height="10" rx="3" fill="#ffffff" stroke="none"/>
    <rect x="41" y="29" width="6" height="10" rx="3" fill="#ffffff" stroke="none"/>
    
    <!-- Mic Boom & Bulb -->
    <path d="M43 36 C43 42 37 44 33 44" stroke-width="3"/>
    <circle cx="31" cy="44" r="2.5" fill="#ffffff" stroke="none"/>
  </g>
</svg>